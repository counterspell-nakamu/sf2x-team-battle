<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>スパ2X 勝敗管理・星取表</title>
    <!-- SortableJS -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/Sortable/1.15.0/Sortable.min.js"></script>
    <style>
        :root {
            --bg-color: #121212;
            --panel-bg: #1e1e1e;
            --text-color: #ffffff;
            --border-color: #333333;
            --p1-color: #ff4d4d;
            --p2-color: #4d94ff;
            --win-color: #ffda6a;
            --lose-color: #555555;
            --palette-bg: #2a2a2a;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            margin: 0;
            padding: 10px;
            font-size: 14px;
        }

        .header-controls {
            display: flex;
            gap: 8px;
            margin-bottom: 10px;
            flex-wrap: wrap;
            align-items: center;
        }

        button, select, input {
            background-color: #333;
            color: #fff;
            border: 1px solid #555;
            padding: 6px 12px;
            border-radius: 4px;
            cursor: pointer;
            font-size: 13px;
        }

        button:hover { background-color: #444; }
        button.active { background-color: #007bff; border-color: #0056b3; }

        .score-board {
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 20px;
            background-color: var(--panel-bg);
            padding: 10px;
            border-radius: 8px;
            margin-bottom: 10px;
            border: 1px solid var(--border-color);
        }

        .team-score { font-size: 28px; font-weight: bold; }
        .p1-score { color: var(--p1-color); }
        .p2-score { color: var(--p2-color); }

        .main-container {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 10px;
        }

        .team-column {
            background-color: var(--panel-bg);
            border-radius: 8px;
            padding: 8px;
            border: 1px solid var(--border-color);
        }

        .team-title {
            text-align: center;
            font-weight: bold;
            padding: 6px;
            margin-bottom: 8px;
            border-radius: 4px;
            font-size: 16px;
        }

        .p1-title { background-color: rgba(255, 77, 77, 0.2); color: var(--p1-color); }
        .p2-title { background-color: rgba(77, 148, 255, 0.2); color: var(--p2-color); }

        .slot-list {
            min-height: 150px;
        }

        .slot-card {
            display: flex;
            align-items: center;
            background-color: #252525;
            border: 1px solid #3d3d3d;
            margin-bottom: 6px;
            padding: 6px;
            border-radius: 6px;
            position: relative;
            cursor: grab;
            transition: border-color 0.2s, background-color 0.2s;
        }

        .slot-card:active { cursor: grabbing; }

        .slot-card.win { border-color: var(--win-color); background-color: rgba(255, 218, 106, 0.05); }
        .slot-card.lose { border-color: var(--lose-color); opacity: 0.6; }

        .slot-index {
            width: 24px;
            font-weight: bold;
            color: #888;
            text-align: center;
        }

        .slot-info {
            flex-grow: 1;
            display: flex;
            flex-direction: column;
            gap: 2px;
            margin: 0 8px;
        }

        .player-name {
            font-weight: bold;
            font-size: 14px;
            color: #eee;
            border: none;
            background: transparent;
            width: 100%;
        }

        .player-name:focus {
            background-color: #333;
            outline: 1px solid #555;
            border-radius: 2px;
        }

        .char-display {
            font-size: 13px;
            color: #aaa;
            cursor: pointer;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .char-display:hover { color: #fff; }

        .char-icon {
            width: 32px;
            height: 32px;
            border-radius: 4px;
            object-fit: cover;
            background-color: #333;
            border: 1px solid #555;
        }

        .slot-actions {
            display: flex;
            gap: 4px;
            align-items: center;
        }

        .btn-action {
            padding: 4px 8px;
            font-size: 12px;
            border-radius: 3px;
        }

        .btn-hide { background-color: #555; }
        .btn-hide.active { background-color: #d9534f; color: white; }

        .btn-bench { background-color: #4a6984; }

        .bench-area {
            margin-top: 15px;
            background-color: #181818;
            border: 1px dashed #444;
            padding: 8px;
            border-radius: 6px;
        }

        .bench-title {
            font-size: 12px;
            color: #888;
            margin-bottom: 6px;
            text-align: center;
        }

        .bench-list {
            min-height: 40px;
            display: flex;
            flex-direction: column;
            gap: 4px;
        }

        /* キャラクター選択パレット */
        .char-palette-modal {
            display: none;
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.7);
            z-index: 1000;
            justify-content: center;
            align-items: center;
        }

        .palette-content {
            background-color: var(--palette-bg);
            padding: 15px;
            border-radius: 8px;
            max-width: 520px;
            width: 90%;
            border: 1px solid #555;
        }

        .palette-grid {
            display: grid;
            grid-template-columns: repeat(5, 1fr);
            gap: 8px;
            margin-top: 10px;
            max-height: 380px;
            overflow-y: auto;
        }

        .char-item {
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 6px;
            background: #333;
            border-radius: 4px;
            cursor: pointer;
            border: 1px solid transparent;
        }

        .char-item:hover {
            border-color: #007bff;
            background: #444;
        }

        .char-item img {
            width: 40px;
            height: 40px;
            border-radius: 4px;
            object-fit: cover;
            margin-bottom: 4px;
        }

        /* 設定モーダル */
        .settings-modal {
            display: none;
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.7);
            z-index: 1000;
            justify-content: center;
            align-items: center;
        }

        .settings-content {
            background-color: var(--panel-bg);
            padding: 20px;
            border-radius: 8px;
            width: 90%;
            max-width: 600px;
            max-height: 85vh;
            overflow-y: auto;
            border: 1px solid var(--border-color);
        }

        .settings-section {
            margin-bottom: 15px;
            padding-bottom: 10px;
            border-bottom: 1px solid #333;
        }

        .settings-section h4 {
            margin: 0 0 8px 0;
            color: #007bff;
        }

        .form-group {
            display: flex;
            align-items: center;
            gap: 10px;
            margin-bottom: 8px;
        }

        .form-group label { width: 140px; }

        .player-inputs {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 10px;
        }

        .team-player-list {
            display: flex;
            flex-direction: column;
            gap: 4px;
        }
    </style>
</head>
<body>

    <div class="header-controls">
        <button id="btn-settings">⚙️ 設定・ルール変更</button>
        <button id="btn-auto-fill">👥 プレイヤー連続初期配置</button>
        <button id="btn-counter-mode">🛡️ 被せモード: OFF</button>
        <button id="btn-reset-scores">🔄 勝敗リセット</button>
    </div>

    <div class="score-board">
        <div class="team-score p1-score" id="p1-total-score">1P: 0</div>
        <div style="color: #888;">VS</div>
        <div class="team-score p2-score" id="p2-total-score">2P: 0</div>
    </div>

    <div class="main-container">
        <!-- 1P Column -->
        <div class="team-column">
            <div class="team-title p1-title" id="p1-team-name-display">1P チーム</div>
            <div class="slot-list" id="p1-slot-list"></div>
            <div class="bench-area">
                <div class="bench-title">ベンチ (控え)</div>
                <div class="bench-list" id="p1-bench-list"></div>
            </div>
        </div>

        <!-- 2P Column -->
        <div class="team-column">
            <div class="team-title p2-title" id="p2-team-name-display">2P チーム</div>
            <div class="slot-list" id="p2-slot-list"></div>
            <div class="bench-area">
                <div class="bench-title">ベンチ (控え)</div>
                <div class="bench-list" id="p2-bench-list"></div>
            </div>
        </div>
    </div>

    <!-- キャラクター選択モーダル -->
    <div class="char-palette-modal" id="char-modal">
        <div class="palette-content">
            <h3 style="margin-top:0;">キャラクター選択</h3>
            <div class="palette-grid" id="palette-grid"></div>
            <div style="text-align: right; margin-top: 15px;">
                <button id="btn-close-char-modal">キャンセル</button>
            </div>
        </div>
    </div>

    <!-- 設定モーダル -->
    <div class="settings-modal" id="settings-modal">
        <div class="settings-content">
            <h3 style="margin-top:0;">対戦設定・人数振り分け</h3>
            
            <div class="settings-section">
                <h4>1. 人数と枠数の設定</h4>
                <div class="form-group">
                    <label>参加人数:</label>
                    <select id="setting-player-count">
                        <option value="2">2人 (1vs1)</option>
                        <option value="3">3人 (2vs1)</option>
                        <option value="4">4人 (2vs2)</option>
                        <option value="5">5人 (3vs2)</option>
                        <option value="6" selected>6人 (3vs3)</option>
                        <option value="7">7人 (4vs3)</option>
                        <option value="8">8人 (4vs4)</option>
                    </select>
                </div>
                <div class="form-group">
                    <label>総キャラ数 (合計枠数):</label>
                    <select id="setting-total-slots">
                        <option value="4">4枠 (2vs2)</option>
                        <option value="6">6枠 (3vs3)</option>
                        <option value="8">8枠 (4vs4)</option>
                        <option value="10">10枠 (5vs5)</option>
                        <option value="12" selected>12枠 (6vs6)</option>
                        <option value="14">14枠 (7vs7)</option>
                        <option value="16">16枠 (8vs8)</option>
                    </select>
                </div>
                <div id="calc-result-info" style="font-size: 12px; color: #aaa; background: #222; padding: 6px; border-radius: 4px;">
                    計算結果: 1P(3人) vs 2P(3人) | 各チーム 6枠
                </div>
            </div>

            <div class="settings-section">
                <h4>2. チーム名とプレイヤー名</h4>
                <div class="form-group">
                    <label>1P チーム名:</label>
                    <input type="text" id="setting-p1-team-name" value="1P チーム">
                </div>
                <div class="form-group">
                    <label>2P チーム名:</label>
                    <input type="text" id="setting-p2-team-name" value="2P チーム">
                </div>

                <div class="player-inputs">
                    <div>
                        <div style="font-weight:bold; color:var(--p1-color); margin-bottom:4px;">1P メンバー</div>
                        <div class="team-player-list" id="p1-player-inputs"></div>
                    </div>
                    <div>
                        <div style="font-weight:bold; color:var(--p2-color); margin-bottom:4px;">2P メンバー</div>
                        <div class="team-player-list" id="p2-player-inputs"></div>
                    </div>
                </div>
            </div>

            <div style="text-align: right; display: flex; gap: 8px; justify-content: flex-end;">
                <button id="btn-save-settings" style="background-color: #28a745;">保存して反映</button>
                <button id="btn-close-settings">キャンセル</button>
            </div>
        </div>
    </div>

    <script>
        // キャラクターマスターデータ（Google Driveの画像リンク・直リンクURL構造）
        const CHARACTERS = [
            { id: 'none', name: '未設定', icon: 'https://drive.google.com/thumbnail?id=1_X_X_X_X_X_X_X_X_X_X_X_X_X_X_X_X&sz=w100' },
            { id: 'ryu', name: 'リュウ', icon: 'https://drive.google.com/thumbnail?id=1_RYU_DRIVE_LINK_EXAMPLE_ID&sz=w100' },
            { id: 'ken', name: 'ケン', icon: 'https://drive.google.com/thumbnail?id=1_KEN_DRIVE_LINK_EXAMPLE_ID&sz=w100' },
            { id: 'chunli', name: '春麗', icon: 'https://drive.google.com/thumbnail?id=1_CHUNLI_DRIVE_LINK_EXAMPLE_ID&sz=w100' },
            { id: 'guile', name: 'ガイル', icon: 'https://drive.google.com/thumbnail?id=1_GUILE_DRIVE_LINK_EXAMPLE_ID&sz=w100' },
            { id: 'zangief', name: 'ザンギエフ', icon: 'https://drive.google.com/thumbnail?id=1_ZANGIEF_DRIVE_LINK_EXAMPLE_ID&sz=w100' },
            { id: 'dhalsim', name: 'ダルシム', icon: 'https://drive.google.com/thumbnail?id=1_DHALSIM_DRIVE_LINK_EXAMPLE_ID&sz=w100' },
            { id: 'blanca', name: 'ブランカ', icon: 'https://drive.google.com/thumbnail?id=1_BLANCA_DRIVE_LINK_EXAMPLE_ID&sz=w100' },
            { id: 'honda', name: 'エドモンド本田', icon: 'https://drive.google.com/thumbnail?id=1_HONDA_DRIVE_LINK_EXAMPLE_ID&sz=w100' },
            { id: 'feilong', name: 'フェイロン', icon: 'https://drive.google.com/thumbnail?id=1_FEILONG_DRIVE_LINK_EXAMPLE_ID&sz=w100' },
            { id: 'deejay', name: 'ディージェイ', icon: 'https://drive.google.com/thumbnail?id=1_DEEJAY_DRIVE_LINK_EXAMPLE_ID&sz=w100' },
            { id: 'hawk', name: 'T.ホーク', icon: 'https://drive.google.com/thumbnail?id=1_HAWK_DRIVE_LINK_EXAMPLE_ID&sz=w100' },
            { id: 'cammy', name: 'キャミィ', icon: 'https://drive.google.com/thumbnail?id=1_CAMMY_DRIVE_LINK_EXAMPLE_ID&sz=w100' },
            { id: 'boxer', name: 'バイソン', icon: 'https://drive.google.com/thumbnail?id=1_BOXER_DRIVE_LINK_EXAMPLE_ID&sz=w100' },
            { id: 'claw', name: 'バルログ', icon: 'https://drive.google.com/thumbnail?id=1_CLAW_DRIVE_LINK_EXAMPLE_ID&sz=w100' },
            { id: 'sagat', name: 'サガット', icon: 'https://drive.google.com/thumbnail?id=1_SAGAT_DRIVE_LINK_EXAMPLE_ID&sz=w100' },
            { id: 'dictator', name: 'ベガ', icon: 'https://drive.google.com/thumbnail?id=1_DICTATOR_DRIVE_LINK_EXAMPLE_ID&sz=w100' },
            { id: 'akuma', name: '豪鬼', icon: 'https://drive.google.com/thumbnail?id=1_AKUMA_DRIVE_LINK_EXAMPLE_ID&sz=w100' }
        ];

        // アプリケーション全体の状態データ
        let state = {
            totalSlotsPerTeam: 6, // 片側の枠数 (デフォルト: 12キャラ＝6vs6)
            playerCount: 6,
            counterMode: false,
            p1TeamName: '1P チーム',
            p2TeamName: '2P チーム',
            p1Players: ['プレイヤー1', 'プレイヤー2', 'プレイヤー3'],
            p2Players: ['プレイヤー4', 'プレイヤー5', 'プレイヤー6'],
            p1Slots: [],
            p2Slots: [],
            p1Bench: [],
            p2Bench: []
        };

        let activeTargetSlot = null; // キャラクター選択対象のスロット情報

        // 初期化処理
        function initApp() {
            initDefaultSlots();
            setupSortable();
            setupEventListeners();
            renderAll();
        }

        // 枠数に基づいて初期スロット生成
        function initDefaultSlots() {
            state.p1Slots = [];
            state.p2Slots = [];
            for (let i = 0; i < state.totalSlotsPerTeam; i++) {
                state.p1Slots.push(createEmptySlot(i, '1P'));
                state.p2Slots.push(createEmptySlot(i, '2P'));
            }
        }

        function createEmptySlot(index, teamPrefix) {
            return {
                id: 'slot_' + Math.random().toString(36).substr(2, 9),
                playerName: `${teamPrefix}_P${(index % 3) + 1}`,
                charId: 'none',
                isSecret: false,
                result: 'none' // 'win', 'lose', 'none'
            };
        }

        // --- 人数＆枠数計算ロジック ---

        function calculateDistribution(totalPlayers, totalSlots) {
            const p1Count = Math.ceil(totalPlayers / 2);
            const p2Count = Math.floor(totalPlayers / 2);
            const slotsPerSide = totalSlots / 2;

            function getCharAllocation(playerCount, totalSideSlots) {
                const base = Math.floor(totalSideSlots / playerCount);
                const remainder = totalSideSlots % playerCount;
                const allocation = [];
                for (let i = 0; i < playerCount; i++) {
                    allocation.push(base + (i < remainder ? 1 : 0));
                }
                return allocation;
            }

            return {
                p1Count,
                p2Count,
                slotsPerSide,
                p1Alloc: getCharAllocation(p1Count, slotsPerSide),
                p2Alloc: getCharAllocation(p2Count, slotsPerSide)
            };
        }

        function updateCalcResultDisplay() {
            const pCount = parseInt(document.getElementById('setting-player-count').value, 10);
            const tSlots = parseInt(document.getElementById('setting-total-slots').value, 10);
            const res = calculateDistribution(pCount, tSlots);

            const p1Text = `1P(${res.p1Count}人: ${res.p1Alloc.join('〜')}キャラ)`;
            const p2Text = `2P(${res.p2Count}人: ${res.p2Alloc.join('〜')}キャラ)`;
            document.getElementById('calc-result-info').innerText = `計算結果: 片側${res.slotsPerSide}枠 | ${p1Text} vs ${p2Text}`;
            
            renderPlayerInputs(res.p1Count, res.p2Count);
        }

        function renderPlayerInputs(p1Count, p2Count) {
            const p1Container = document.getElementById('p1-player-inputs');
            const p2Container = document.getElementById('p2-player-inputs');

            p1Container.innerHTML = '';
            p2Container.innerHTML = '';

            for (let i = 0; i < p1Count; i++) {
                const val = state.p1Players[i] || `1P_P${i+1}`;
                p1Container.innerHTML += `<input type="text" class="p1-player-input" value="${val}">`;
            }
            for (let i = 0; i < p2Count; i++) {
                const val = state.p2Players[i] || `2P_P${i+1}`;
                p2Container.innerHTML += `<input type="text" class="p2-player-input" value="${val}">`;
            }
        }

        // --- 交互（A, B, C, A, B, C...）連続回避・自動連続初期配置 ---

        function autoFillGroupedPlayers() {
            const pCount = state.playerCount;
            const tSlots = state.totalSlotsPerTeam * 2;
            const res = calculateDistribution(pCount, tSlots);

            function buildRotatedList(players, alloc) {
                let playerQueues = players.map((p, idx) => {
                    return new Array(alloc[idx]).fill(p);
                });

                let result = [];
                let added = true;
                while (added) {
                    added = false;
                    for (let i = 0; i < playerQueues.length; i++) {
                        if (playerQueues[i].length > 0) {
                            result.push(playerQueues[i].shift());
                            added = true;
                        }
                    }
                }
                return result;
            }

            const p1Order = buildRotatedList(state.p1Players, res.p1Alloc);
            const p2Order = buildRotatedList(state.p2Players, res.p2Alloc);

            state.totalSlotsPerTeam = res.slotsPerSide;

            state.p1Slots = p1Order.map((name, i) => ({
                id: 'slot_p1_' + i + '_' + Math.random().toString(36).substr(2, 5),
                playerName: name,
                charId: state.p1Slots[i]?.charId || 'none',
                isSecret: false,
                result: state.p1Slots[i]?.result || 'none'
            }));

            state.p2Slots = p2Order.map((name, i) => ({
                id: 'slot_p2_' + i + '_' + Math.random().toString(36).substr(2, 5),
                playerName: name,
                charId: state.p2Slots[i]?.charId || 'none',
                isSecret: false,
                result: state.p2Slots[i]?.result || 'none'
            }));

            renderAll();
        }

        // --- UIレンダリング ---

        function renderAll() {
            document.getElementById('p1-team-name-display').innerText = state.p1TeamName;
            document.getElementById('p2-team-name-display').innerText = state.p2TeamName;

            renderSlotList('p1', state.p1Slots, 'p1-slot-list');
            renderSlotList('p2', state.p2Slots, 'p2-slot-list');
            renderBenchList('p1', state.p1Bench, 'p1-bench-list');
            renderBenchList('p2', state.p2Bench, 'p2-bench-list');

            updateScores();
        }

        function renderSlotList(team, slots, containerId) {
            const container = document.getElementById(containerId);
            container.innerHTML = '';

            slots.forEach((slot, index) => {
                const charInfo = CHARACTERS.find(c => c.id === slot.charId) || CHARACTERS[0];
                const card = document.createElement('div');
                card.className = `slot-card ${slot.result}`;
                card.dataset.id = slot.id;

                const displayCharName = slot.isSecret ? '???' : charInfo.name;
                const displayCharIcon = slot.isSecret ? '' : charInfo.icon;

                card.innerHTML = `
                    <div class="slot-index">${index + 1}</div>
                    <div class="slot-info">
                        <input type="text" class="player-name" value="${escapeHtml(slot.playerName)}" data-team="${team}" data-index="${index}">
                        <div class="char-display" onclick="openCharModal('${team}', ${index}, 'slot')">
                            ${displayCharIcon ? `<img src="${displayCharIcon}" class="char-icon" alt="${displayCharName}">` : `<div class="char-icon"></div>`}
                            <span>${displayCharName}</span>
                        </div>
                    </div>
                    <div class="slot-actions">
                        <button class="btn-action btn-hide ${slot.isSecret ? 'active' : ''}" onclick="toggleSecret('${team}', ${index})">伏せ</button>
                        <button class="btn-action ${slot.result === 'win' ? 'active' : ''}" onclick="setResult('${team}', ${index}, 'win')">勝</button>
                        <button class="btn-action ${slot.result === 'lose' ? 'active' : ''}" onclick="setResult('${team}', ${index}, 'lose')">負</button>
                        <button class="btn-action btn-bench" onclick="moveToBench('${team}', ${index})">控</button>
                    </div>
                `;

                const nameInput = card.querySelector('.player-name');
                nameInput.addEventListener('change', (e) => {
                    slots[index].playerName = e.target.value;
                });

                container.appendChild(card);
            });
        }

        function renderBenchList(team, benchSlots, containerId) {
            const container = document.getElementById(containerId);
            container.innerHTML = '';

            benchSlots.forEach((slot, index) => {
                const charInfo = CHARACTERS.find(c => c.id === slot.charId) || CHARACTERS[0];
                const card = document.createElement('div');
                card.className = 'slot-card';
                card.style.opacity = '0.8';
                card.dataset.id = slot.id;

                card.innerHTML = `
                    <div class="slot-info">
                        <span style="font-weight:bold;">${escapeHtml(slot.playerName)}</span>
                        <span style="font-size:11px; color:#aaa;">${charInfo.name}</span>
                    </div>
                    <div class="slot-actions">
                        <button class="btn-action" onclick="moveFromBench('${team}', ${index})">復帰</button>
                    </div>
                `;
                container.appendChild(card);
            });
        }

        // --- 勝敗＆スコア計算 ---

        function setResult(team, index, resType) {
            const targetSlots = team === 'p1' ? state.p1Slots : state.p2Slots;
            const opponentSlots = team === 'p1' ? state.p2Slots : state.p1Slots;

            if (targetSlots[index].result === resType) {
                targetSlots[index].result = 'none';
                if (opponentSlots[index]) opponentSlots[index].result = 'none';
            } else {
                targetSlots[index].result = resType;
                if (opponentSlots[index]) {
                    opponentSlots[index].result = resType === 'win' ? 'lose' : 'win';
                }
            }
            renderAll();
        }

        function updateScores() {
            const p1Wins = state.p1Slots.filter(s => s.result === 'win').length;
            const p2Wins = state.p2Slots.filter(s => s.result === 'win').length;

            document.getElementById('p1-total-score').innerText = `${state.p1TeamName}: ${p1Wins}`;
            document.getElementById('p2-total-score').innerText = `${state.p2TeamName}: ${p2Wins}`;
        }

        function toggleSecret(team, index) {
            const targetSlots = team === 'p1' ? state.p1Slots : state.p2Slots;
            targetSlots[index].isSecret = !targetSlots[index].isSecret;
            renderAll();
        }

        // --- ベンチ移動機能 ---

        function moveToBench(team, index) {
            const slots = team === 'p1' ? state.p1Slots : state.p2Slots;
            const bench = team === 'p1' ? state.p1Bench : state.p2Bench;
            
            const [moved] = slots.splice(index, 1);
            bench.push(moved);
            renderAll();
        }

        function moveFromBench(team, index) {
            const slots = team === 'p1' ? state.p1Slots : state.p2Slots;
            const bench = team === 'p1' ? state.p1Bench : state.p2Bench;

            const [moved] = bench.splice(index, 1);
            slots.push(moved);
            renderAll();
        }

        // --- ドラッグ＆ドロップ (SortableJS) ---

        function setupSortable() {
            const p1List = document.getElementById('p1-slot-list');
            const p2List = document.getElementById('p2-slot-list');

            const options = {
                animation: 150,
                onEnd: function (evt) {
                    const team = evt.to.id.includes('p1') ? 'p1' : 'p2';
                    const slots = team === 'p1' ? state.p1Slots : state.p2Slots;
                    
                    const movedItem = slots.splice(evt.oldIndex, 1)[0];
                    slots.splice(evt.newIndex, 0, movedItem);
                    
                    renderAll();
                }
            };

            new Sortable(p1List, options);
            new Sortable(p2List, options);
        }

        // --- キャラモーダル制御 ---

        function openCharModal(team, index, location) {
            activeTargetSlot = { team, index, location };
            const grid = document.getElementById('palette-grid');
            grid.innerHTML = '';

            CHARACTERS.forEach(char => {
                const item = document.createElement('div');
                item.className = 'char-item';
                item.innerHTML = `
                    ${char.icon ? `<img src="${char.icon}" alt="${char.name}">` : `<div style="width:40px;height:40px;background:#222;border-radius:4px;margin-bottom:4px;"></div>`}
                    <div style="font-size:11px;">${char.name}</div>
                `;
                item.onclick = () => selectCharacter(char.id);
                grid.appendChild(item);
            });

            document.getElementById('char-modal').style.display = 'flex';
        }

        function selectCharacter(charId) {
            if (!activeTargetSlot) return;
            const { team, index, location } = activeTargetSlot;
            
            if (location === 'slot') {
                const slots = team === 'p1' ? state.p1Slots : state.p2Slots;
                slots[index].charId = charId;
            }
            
            document.getElementById('char-modal').style.display = 'none';
            renderAll();
        }

        // --- イベントリスナー設定 ---

        function setupEventListeners() {
            document.getElementById('btn-settings').onclick = () => {
                document.getElementById('setting-player-count').value = state.playerCount;
                document.getElementById('setting-total-slots').value = state.totalSlotsPerTeam * 2;
                document.getElementById('setting-p1-team-name').value = state.p1TeamName;
                document.getElementById('setting-p2-team-name').value = state.p2TeamName;
                updateCalcResultDisplay();
                document.getElementById('settings-modal').style.display = 'flex';
            };

            document.getElementById('btn-close-settings').onclick = () => {
                document.getElementById('settings-modal').style.display = 'none';
            };

            document.getElementById('btn-close-char-modal').onclick = () => {
                document.getElementById('char-modal').style.display = 'none';
            };

            document.getElementById('setting-player-count').onchange = updateCalcResultDisplay;
            document.getElementById('setting-total-slots').onchange = updateCalcResultDisplay;

            document.getElementById('btn-save-settings').onclick = () => {
                state.playerCount = parseInt(document.getElementById('setting-player-count').value, 10);
                const totalSlots = parseInt(document.getElementById('setting-total-slots').value, 10);
                state.totalSlotsPerTeam = totalSlots / 2;

                state.p1TeamName = document.getElementById('setting-p1-team-name').value;
                state.p2TeamName = document.getElementById('setting-p2-team-name').value;

                state.p1Players = Array.from(document.querySelectorAll('.p1-player-input')).map(i => i.value);
                state.p2Players = Array.from(document.querySelectorAll('.p2-player-input')).map(i => i.value);

                document.getElementById('settings-modal').style.display = 'none';
                autoFillGroupedPlayers();
            };

            document.getElementById('btn-counter-mode').onclick = (e) => {
                state.counterMode = !state.counterMode;
                e.target.innerText = `🛡️ 被せモード: ${state.counterMode ? 'ON' : 'OFF'}`;
                e.target.classList.toggle('active', state.counterMode);
            };

            document.getElementById('btn-auto-fill').onclick = () => {
                if (confirm('現在の配置を上書きし、同一人物が連続しないローテーションで初期配置しますか？')) {
                    autoFillGroupedPlayers();
                }
            };

            document.getElementById('btn-reset-scores').onclick = () => {
                if (confirm('すべての勝敗結果をクリアしますか？')) {
                    state.p1Slots.forEach(s => s.result = 'none');
                    state.p2Slots.forEach(s => s.result = 'none');
                    renderAll();
                }
            };
        }

        function escapeHtml(str) {
            return String(str).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;');
        }

        window.onload = initApp;
    </script>
</body>
</html>
