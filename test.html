<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <title>スパ2X チームオーダー管理・OBS配信ツール</title>
    <!-- SortableJS CDN -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/Sortable/1.15.0/Sortable.min.js"></script>
    <style>
        body {
            font-family: sans-serif;
            background: #121212;
            color: #e0e0e0;
            margin: 0;
            padding: 20px;
        }
        h1, h2 {
            color: #fff;
        }
        .container {
            max-width: 1200px;
            margin: 0 auto;
        }
        .section {
            background: #1e1e1e;
            border: 1px solid #333;
            padding: 20px;
            margin-bottom: 20px;
            border-radius: 8px;
        }
        button {
            background: #333;
            color: #fff;
            border: 1px solid #555;
            padding: 8px 16px;
            margin: 4px;
            border-radius: 4px;
            cursor: pointer;
        }
        button:hover {
            background: #444;
        }
        input[type="text"] {
            background: #2a2a2a;
            border: 1px solid #444;
            color: #fff;
            padding: 6px;
            border-radius: 4px;
        }
        .player-list {
            display: flex;
            flex-wrap: wrap;
            gap: 8px;
            min-height: 50px;
            background: #252525;
            padding: 10px;
            border-radius: 4px;
            margin-bottom: 10px;
        }
        .player-chip {
            background: #333;
            border: 1px solid #666;
            padding: 6px 12px;
            border-radius: 4px;
            cursor: grab;
            display: flex;
            align-items: center;
            gap: 6px;
        }
        .player-chip:active {
            cursor: grabbing;
        }
        .team-container {
            display: flex;
            gap: 20px;
            flex-wrap: wrap;
        }
        .team-box {
            flex: 1;
            min-width: 300px;
            background: #252525;
            border: 1px solid #444;
            padding: 15px;
            border-radius: 6px;
        }
        /* カード裏返し（隠し）用スタイル */
        .card-slot {
            background: #2a2a2a;
            border: 2px dashed #555;
            padding: 10px;
            margin-bottom: 8px;
            border-radius: 4px;
            min-height: 40px;
            display: flex;
            align-items: center;
            justify-content: space-between;
        }
        .card-slot.hidden .card-content {
            display: none;
        }
        .card-slot.hidden::after {
            content: "【 裏返し（非公開） 】";
            color: #888;
            font-weight: bold;
            letter-spacing: 2px;
        }
    </style>
</head>
<body>
<div class="container">
    <h1>スパ2X チームオーダー管理・OBS配信ツール</h1>

    <!-- プレイヤー登録セクション -->
    <div class="section">
        <h2>プレイヤー登録</h2>
        <div>
            <input type="text" id="newPlayerName" placeholder="プレイヤー名を入力">
            <button id="addPlayerBtn">追加</button>
            <button id="clearPlayersBtn">全員クリア</button>
        </div>
        <div id="registeredPlayers" class="player-list">
            <!-- プレイヤーチップがここに入ります -->
        </div>
    </div>

    <!-- チーム分け・オーダー設定セクション -->
    <div class="section">
        <h2>チームオーダー設定</h2>
        <div style="margin-bottom: 10px;">
            <button id="shuffleRandomBtn">完全前ランダム（裏返しシャッフル）</button>
            <button id="toggleRevealBtn">全体めくる / 隠す</button>
        </div>
        
        <div class="team-container">
            <!-- チームA -->
            <div class="team-box">
                <h3>チーム A</h3>
                <div id="teamA-slots">
                    <!-- スロットが動的に生成されます -->
                </div>
            </div>
            <!-- チームB -->
            <div class="team-box">
                <h3>チーム B</h3>
                <div id="teamB-slots">
                    <!-- スロットが動的に生成されます -->
                </div>
            </div>
        </div>
    </div>
</div>

<script>
    // 状態管理
    let players = [];
    let teamASlots = ['', '', '', '', ''];
    let teamBSlots = ['', '', '', '', ''];
    let isAllHidden = true; // 初期状態は裏返し（非公開）

    const nameInput = document.getElementById('newPlayerName');
    const addBtn = document.getElementById('addPlayerBtn');
    const clearBtn = document.getElementById('clearPlayersBtn');
    const playersContainer = document.getElementById('registeredPlayers');
    const shuffleBtn = document.getElementById('shuffleRandomBtn');
    const toggleRevealBtn = document.getElementById('toggleRevealBtn');
    
    const teamAContainer = document.getElementById('teamA-slots');
    const teamBContainer = document.getElementById('teamB-slots');

    // 初期描画
    function init() {
        renderPlayers();
        renderTeams();
    }

    // プレイヤー追加
    function addPlayer() {
        const name = nameInput.value.trim();
        if (name && !players.includes(name)) {
            players.push(name);
            nameInput.value = '';
            renderPlayers();
        }
    }

    addBtn.addEventListener('click', addPlayer);
    nameInput.addEventListener('keypress', (e) => {
        if (e.key === 'Enter') addPlayer();
    });

    clearBtn.addEventListener('click', () => {
        players = [];
        renderPlayers();
    });

    // 登録プレイヤー一覧の描画
    function renderPlayers() {
        playersContainer.innerHTML = '';
        players.forEach((player, index) => {
            const chip = document.createElement('div');
            chip.className = 'player-chip';
            chip.innerHTML = `<span>${player}</span> <button style="padding:2px 6px; font-size:10px;" onclick="removePlayer(${index})">×</button>`;
            playersContainer.appendChild(chip);
        });
    }

    window.removePlayer = function(index) {
        players.splice(index, 1);
        renderPlayers();
    };

    // チームスロットの描画
    function renderTeams() {
        teamAContainer.innerHTML = '';
        teamBSlots = teamBSlots || ['', '', '', '', '']; // 安全策

        // チームAの描画
        teamASlots.forEach((pName, idx) => {
            teamAContainer.appendChild(createSlotElement('A', idx, pName));
        });

        // チームBの描画
        teamBSlots.forEach((pName, idx) => {
            teamBContainer.appendChild(createSlotElement('B', idx, pName));
        });
    }

    function createSlotElement(team, idx, pName) {
        const slot = document.createElement('div');
        slot.className = `card-slot ${isAllHidden ? 'hidden' : ''}`;
        
        const content = document.createElement('div');
        content.className = 'card-content';
        content.textContent = `${idx + 1}将: ${pName || '（未配置）'}`;

        slot.appendChild(content);
        return slot;
    }

    // 裏返しのまま完全ランダムシャッフル
    shuffleBtn.addEventListener('click', () => {
        // 登録されている全プレイヤーをシャッフル用に複製
        let allPool = [...players];
        
        // シャッフルアルゴリズム (Fisher-Yates)
        for (let i = allPool.length - 1; i > 0; i--) {
            const j = Math.floor(Math.random() * (i + 1));
            [allPool[i], allPool[j]] = [allPool[j], allPool[i]];
        }

        // チームAとチームBに振り分け（例：交互、または前半後半など。ここでは5人ずつまたはプール数に応じて分配）
        const half = Math.ceil(allPool.length / 2);
        teamASlots = allPool.slice(0, 5);
        teamBSlots = allPool.slice(5, 10);

        // 足りない枠を空文字で埋める
        while(teamASlots.length < 5) teamASlots.push('');
        while(teamBSlots.length < 5) teamBSlots.push('');

        // シャッフル実行時は「裏返し（非公開）」の状態を強制的に維持する
        isAllHidden = true;

        // 再描画（裏返しのまま裏でデータがシャッフルされる）
        renderTeams();
        alert('裏返しのままシャッフルが完了しました！');
    });

    // 全体めくる / 隠すトグル
    toggleRevealBtn.addEventListener('click', () => {
        isAllHidden = !isAllHidden;
        renderTeams();
    });

    // 初回実行
    init();
</script>
</body>
</html>
