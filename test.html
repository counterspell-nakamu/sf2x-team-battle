<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>スパ2X チーム管理 & OBSツール</title>
  <style>
    :root {
      --bg-color: #0f1117;
      --panel-bg: #1a1d24;
      --card-bg: #222631;
      --text-main: #f0f2f5;
      --text-sub: #a0a5b5;
      --border-color: #313644;
      --p1-color: #e63946;
      --p1-bg: rgba(230, 57, 70, 0.15);
      --p2-color: #457b9d;
      --p2-bg: rgba(69, 123, 157, 0.15);
      --win-color: #ffb703;
      --accent: #2a9d8f;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background-color: var(--bg-color);
      color: var(--text-main);
      padding: 12px;
      font-size: 13px;
    }

    /* 上部操作パネル */
    .top-panel {
      background-color: var(--panel-bg);
      border: 1px solid var(--border-color);
      border-radius: 6px;
      padding: 10px;
      margin-bottom: 12px;
    }

    .panel-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 8px;
      cursor: pointer;
      user-select: none;
    }

    .panel-title { font-weight: bold; font-size: 14px; }

    .room-info {
      display: flex;
      align-items: center;
      gap: 6px;
      font-size: 12px;
    }

    .room-input {
      background: #111;
      border: 1px solid var(--border-color);
      color: #fff;
      padding: 2px 6px;
      border-radius: 3px;
      width: 100px;
    }

    .btn {
      background: #2c313e;
      color: #fff;
      border: 1px solid var(--border-color);
      padding: 4px 10px;
      border-radius: 4px;
      cursor: pointer;
      font-size: 12px;
      transition: background 0.2s;
    }

    .btn:hover { background: #3a4152; }
    .btn-orange { background: #e76f51; }
    .btn-orange:hover { background: #f4a261; }
    .btn-green { background: #2a9d8f; }
    .btn-green:hover { background: #2ec4b6; }

    /* 設定エリア */
    .controls-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 12px;
      margin-top: 8px;
    }

    .section-box {
      background: #14171f;
      padding: 8px;
      border-radius: 4px;
      border: 1px solid #252a36;
    }

    .section-title {
      font-weight: bold;
      margin-bottom: 6px;
      color: var(--text-sub);
    }

    .radio-group {
      display: flex;
      flex-direction: column;
      gap: 4px;
      margin-bottom: 6px;
    }

    .radio-label {
      display: flex;
      align-items: center;
      gap: 6px;
      cursor: pointer;
    }

    .player-tags {
      display: flex;
      flex-wrap: wrap;
      gap: 4px;
      margin-bottom: 6px;
    }

    .player-tag {
      background: #2a2e3d;
      padding: 2px 8px;
      border-radius: 12px;
      display: flex;
      align-items: center;
      gap: 4px;
    }

    .tag-remove {
      cursor: pointer;
      color: #ff6b6b;
      font-weight: bold;
    }

    .add-player-form {
      display: flex;
      gap: 4px;
      margin-bottom: 8px;
    }

    .text-input {
      background: #111;
      border: 1px solid var(--border-color);
      color: #fff;
      padding: 4px 8px;
      border-radius: 4px;
      flex-grow: 1;
    }

    .select-input {
      background: #111;
      border: 1px solid var(--border-color);
      color: #fff;
      padding: 4px 8px;
      border-radius: 4px;
      margin-bottom: 6px;
    }

    /* メインレイアウト */
    .main-grid {
      display: grid;
      grid-template-columns: 1fr 2fr 2fr 1fr;
      gap: 10px;
    }

    .column {
      background: var(--panel-bg);
      border: 1px solid var(--border-color);
      border-radius: 6px;
      padding: 8px;
      display: flex;
      flex-direction: column;
    }

    .col-header {
      text-align: center;
      font-weight: bold;
      padding: 6px;
      margin-bottom: 8px;
      border-radius: 4px;
      background: #14171f;
    }

    .p1-header { color: var(--p1-color); background: var(--p1-bg); }
    .p2-header { color: var(--p2-color); background: var(--p2-bg); }

    .slot-container {
      display: flex;
      flex-direction: column;
      gap: 6px;
      flex-grow: 1;
      min-height: 200px;
    }

    .card {
      background: var(--card-bg);
      border: 1px solid var(--border-color);
      border-radius: 4px;
      padding: 6px;
      display: flex;
      align-items: center;
      gap: 6px;
      cursor: grab;
    }

    .card.bench-card {
      cursor: default;
    }

    .slot-idx {
      width: 18px;
      text-align: center;
      font-weight: bold;
      color: var(--text-sub);
    }

    .card-info {
      flex-grow: 1;
      display: flex;
      flex-direction: column;
    }

    .p-name { font-weight: bold; }
    .c-name { font-size: 11px; color: var(--text-sub); }

    .card-btns {
      display: flex;
      gap: 2px;
    }

    .btn-xs {
      padding: 2px 4px;
      font-size: 10px;
      border-radius: 2px;
    }

    /* モーダル表示 */
    .modal-overlay {
      display: none;
      position: fixed;
      top: 0; left: 0; right: 0; bottom: 0;
      background: rgba(0, 0, 0, 0.7);
      z-index: 1000;
      justify-content: center;
      align-items: center;
    }

    .modal-content {
      background: var(--panel-bg);
      border: 1px solid var(--border-color);
      border-radius: 8px;
      width: 90%;
      max-width: 500px;
      max-height: 85vh;
      display: flex;
      flex-direction: column;
      padding: 16px;
      box-shadow: 0 10px 25px rgba(0,0,0,0.5);
    }

    .modal-header {
      font-size: 16px;
      font-weight: bold;
      margin-bottom: 12px;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .modal-body {
      overflow-y: auto;
      flex-grow: 1;
      display: flex;
      flex-direction: column;
      gap: 8px;
      padding-right: 4px;
    }

    .order-item {
      background: var(--card-bg);
      padding: 6px 10px;
      border-radius: 4px;
      display: flex;
      align-items: center;
      gap: 8px;
      border: 1px solid var(--border-color);
    }

    .order-item select {
      background: #111;
      color: #fff;
      border: 1px solid var(--border-color);
      padding: 2px 4px;
      border-radius: 3px;
    }

    .modal-footer {
      margin-top: 12px;
      display: flex;
      justify-content: flex-end;
      gap: 8px;
    }
  </style>
</head>
<body>

  <!-- 管理操作パネル -->
  <div class="top-panel">
    <div class="panel-header" id="toggle-panel">
      <span class="panel-title">▼ ⚙️ 管理操作パネル</span>
      <div class="room-info" onclick="event.stopPropagation();">
        🏠 現在のルーム: <strong id="room-display">default</strong>
        <input type="text" id="room-input" class="room-input" value="default">
        <button id="btn-change-room" class="btn btn-orange">部屋移動</button>
      </div>
    </div>

    <div class="controls-grid" id="panel-content">
      <!-- 1. プレイヤー選択 & 枠数設定 -->
      <div class="section-box">
        <div class="section-title">1. プレイヤー選択 & 枠数設定</div>
        
        <div style="margin-bottom: 8px;">
          <label style="font-size: 12px; color: var(--text-sub);">対戦枠数 (片側): </label>
          <select id="select-max-slots" class="select-input">
            <option value="4">4枠 (計8名)</option>
            <option value="6">6枠 (計12名)</option>
            <option value="8">8枠 (計16名)</option>
            <option value="10">10枠 (計20名)</option>
            <option value="12">12枠 (計24名)</option>
            <option value="14">14枠 (計28名)</option>
            <option value="16" selected>16枠 (計32名)</option>
          </select>
        </div>

        <div class="radio-group">
          <label class="radio-label"><input type="radio" name="input-mode" value="both" checked> 💻 PC1台で両チーム分を入力する</label>
          <label class="radio-label"><input type="radio" name="input-mode" value="p1"> 🔴 この端末は 1Pチームのみ 操作&閲覧</label>
          <label class="radio-label"><input type="radio" name="input-mode" value="p2"> 🔵 この端末は 2Pチームのみ 操作&閲覧</label>
        </div>

        <div class="player-tags" id="player-tags-container"></div>

        <div class="add-player-form">
          <input type="text" id="new-player-name" class="text-input" placeholder="新しいプレイヤー名を追加">
          <button id="btn-add-player" class="btn">名簿に追加</button>
        </div>

        <button id="btn-auto-assign" class="btn btn-green" style="width: 100%;">チェックした人を1P / 2Pチームに自動振り分け</button>
      </div>

      <!-- 2. オーダー & キャラ設定 -->
      <div class="section-box">
        <div class="section-title">2. オーダー＆キャラ設定</div>
        
        <div class="radio-group">
          <label class="radio-label"><input type="radio" name="order-mode" value="manual" checked> 手動設定（完全自由）</label>
          <label class="radio-label"><input type="radio" name="order-mode" value="shuffle-taisho"> 1〜(N-1)人目シャッフル ＋ 大将固定</label>
          <label class="radio-label"><input type="radio" name="order-mode" value="kabuse"> 先鋒申告 ＋ 2〜N人目被せ</label>
        </div>

        <div style="display: flex; flex-direction: column; gap: 6px; margin-top: 12px;">
          <button id="btn-order-p1" class="btn btn-green" style="background: var(--p1-color);">🔴 1Pチーム オーダー設定</button>
          <button id="btn-order-p2" class="btn btn-green" style="background: var(--p2-color);">🔵 2Pチーム オーダー設定</button>
        </div>
      </div>
    </div>
  </div>

  <!-- メインエリア -->
  <div class="main-grid">
    <!-- 1P 待機 (ベンチ) -->
    <div class="column">
      <div class="col-header">1P 待機 (ベンチ)</div>
      <div class="slot-container" id="p1-bench-list"></div>
    </div>

    <!-- 1P TEAM (対戦枠) -->
    <div class="column">
      <div class="col-header p1-header">1P TEAM (対戦枠)</div>
      <div class="slot-container" id="p1-team-list"></div>
    </div>

    <!-- 2P TEAM (対戦枠) -->
    <div class="column">
      <div class="col-header p2-header">2P TEAM (対戦枠)</div>
      <div class="slot-container" id="p2-team-list"></div>
    </div>

    <!-- 2P 待機 (ベンチ) -->
    <div class="column">
      <div class="col-header">2P 待機 (ベンチ)</div>
      <div class="slot-container" id="p2-bench-list"></div>
    </div>
  </div>

  <!-- オーダー設定モーダルダイアログ -->
  <div class="modal-overlay" id="order-modal">
    <div class="modal-content">
      <div class="modal-header">
        <span id="modal-title">🔴 1Pチーム オーダー設定</span>
        <button class="btn btn-xs" onclick="closeOrderModal()">✕</button>
      </div>
      <div style="margin-bottom: 8px;">
        <button id="btn-modal-shuffle" class="btn btn-orange" style="width: 100%;">🔀 現在のルールで並び替え実行</button>
      </div>
      <div class="modal-body" id="modal-order-list"></div>
      <div class="modal-footer">
        <button class="btn" onclick="closeOrderModal()">キャンセル</button>
        <button id="btn-save-order" class="btn btn-green">確定・保存</button>
      </div>
    </div>
  </div>

  <script>
    // スパ2X 16キャラクター定義
    const CHARACTERS = [
      'リュウ', 'ケン', 'チュンリー', 'ガイル', 'ブランカ', 'ザンギエフ', 'ダルシム', 'エドモンド本田',
      'バイソン', 'バルログ', 'サガット', 'ベガ', 'キャミィ', 'ディージェイ', 'サンダーホーク', 'フェイロン'
    ];

    // --- アプリケーション状態管理 ---
    let state = {
      maxSlots: 16,
      room: 'default',
      playersMaster: ['サコー', 'ナカム〜', 'ぐっち', 'こたか', 'サシシ'],
      p1Team: [],
      p2Team: [],
      p1Bench: [],
      p2Bench: []
    };

    let currentEditingTeam = 'p1'; // 'p1' or 'p2'
    let editingTeamTemp = []; // モーダル編集用の作業配列

    // 初期化関数
    function init() {
      setupEventListeners();
      renderAll();
    }

    // イベントリスナー設定
    function setupEventListeners() {
      // パネル折りたたみ
      document.getElementById('toggle-panel').addEventListener('click', () => {
        const content = document.getElementById('panel-content');
        content.style.display = content.style.display === 'none' ? 'grid' : 'none';
      });

      // 枠数変更
      document.getElementById('select-max-slots').addEventListener('change', (e) => {
        state.maxSlots = parseInt(e.target.value, 10);
        adjustSlotsToMax();
        renderAll();
      });

      // プレイヤー追加
      document.getElementById('btn-add-player').addEventListener('click', () => {
        const input = document.getElementById('new-player-name');
        const name = input.value.trim();
        if (name && !state.playersMaster.includes(name)) {
          state.playersMaster.push(name);
          input.value = '';
          renderMasterPlayers();
        }
      });

      // 自動振り分けボタン
      document.getElementById('btn-auto-assign').addEventListener('click', () => {
        autoAssignCheckedPlayers();
      });

      // オーダー設定ボタン (1P / 2P)
      document.getElementById('btn-order-p1').addEventListener('click', () => openOrderModal('p1'));
      document.getElementById('btn-order-p2').addEventListener('click', () => openOrderModal('p2'));

      // モーダル内シャッフル実行
      document.getElementById('btn-modal-shuffle').addEventListener('click', () => runOrderRule());

      // オーダー確定保存
      document.getElementById('btn-save-order').addEventListener('click', () => saveOrderModal());

      // 部屋移動ボタン
      document.getElementById('btn-change-room').addEventListener('click', () => {
        const roomVal = document.getElementById('room-input').value.trim();
        if (roomVal) {
          state.room = roomVal;
          document.getElementById('room-display').innerText = roomVal;
        }
      });
    }

    // オーダーモーダルを開く
    function openOrderModal(teamKey) {
      currentEditingTeam = teamKey;
      const teamName = teamKey === 'p1' ? '🔴 1Pチーム' : '🔵 2Pチーム';
      document.getElementById('modal-title').innerText = `${teamName} オーダー＆キャラ設定`;

      const sourceTeam = teamKey === 'p1' ? state.p1Team : state.p2Team;
      // ディープコピーで編集用作業配列を作成
      editingTeamTemp = JSON.parse(JSON.stringify(sourceTeam));

      renderModalOrderList();
      document.getElementById('order-modal').style.display = 'flex';
    }

    function closeOrderModal() {
      document.getElementById('order-modal').style.display = 'none';
    }

    // モーダル内のプレイヤー＆キャラ一覧描画
    function renderModalOrderList() {
      const container = document.getElementById('modal-order-list');
      container.innerHTML = '';

      editingTeamTemp.forEach((player, idx) => {
        const row = document.createElement('div');
        row.className = 'order-item';
        
        let charOptions = `<option value="">--キャラ選択--</option>`;
        CHARACTERS.forEach(c => {
          const selected = player.char === c ? 'selected' : '';
          charOptions += `<option value="${c}" ${selected}>${c}</option>`;
        });

        row.innerHTML = `
          <span style="width: 24px; font-weight: bold;">${idx + 1}.</span>
          <span style="flex-grow: 1; font-weight: bold;">${escapeHtml(player.name)}</span>
          <select onchange="updateTempChar(${idx}, this.value)">
            ${charOptions}
          </select>
          <button class="btn btn-xs" onclick="moveTempOrder(${idx}, -1)">▲</button>
          <button class="btn btn-xs" onclick="moveTempOrder(${idx}, 1)">▼</button>
        `;
        container.appendChild(row);
      });
    }

    function updateTempChar(idx, charName) {
      editingTeamTemp[idx].char = charName;
    }

    function moveTempOrder(idx, direction) {
      const newIdx = idx + direction;
      if (newIdx < 0 || newIdx >= editingTeamTemp.length) return;
      const temp = editingTeamTemp[idx];
      editingTeamTemp[idx] = editingTeamTemp[newIdx];
      editingTeamTemp[newIdx] = temp;
      renderModalOrderList();
    }

    // 選択されたルール（ラジオボタン）に応じて並び替えを実行
    function runOrderRule() {
      const mode = document.querySelector('input[name="order-mode"]:checked').value;
      if (editingTeamTemp.length <= 1) return;

      if (mode === 'shuffle-taisho') {
        // 大将（最後の人）以外をシャッフル
        const taisho = editingTeamTemp.pop();
        for (let i = editingTeamTemp.length - 1; i > 0; i--) {
          const j = Math.floor(Math.random() * (i + 1));
          [editingTeamTemp[i], editingTeamTemp[j]] = [editingTeamTemp[j], editingTeamTemp[i]];
        }
        editingTeamTemp.push(taisho);
      } else if (mode === 'kabuse') {
        // 全体をランダムシャッフル
        for (let i = editingTeamTemp.length - 1; i > 0; i--) {
          const j = Math.floor(Math.random() * (i + 1));
          [editingTeamTemp[i], editingTeamTemp[j]] = [editingTeamTemp[j], editingTeamTemp[i]];
        }
      } else {
        // 完全自由シャッフル
        for (let i = editingTeamTemp.length - 1; i > 0; i--) {
          const j = Math.floor(Math.random() * (i + 1));
          [editingTeamTemp[i], editingTeamTemp[j]] = [editingTeamTemp[j], editingTeamTemp[i]];
        }
      }
      renderModalOrderList();
    }

    // モーダルの設定内容を確定保存
    function saveOrderModal() {
      if (currentEditingTeam === 'p1') {
        state.p1Team = JSON.parse(JSON.stringify(editingTeamTemp));
      } else {
        state.p2Team = JSON.parse(JSON.stringify(editingTeamTemp));
      }
      closeOrderModal();
      renderAll();
    }

    // チェックされたプレイヤーを1P/2Pにランダム自動振り分け
    function autoAssignCheckedPlayers() {
      const checkedNames = [];
      state.playersMaster.forEach((name, idx) => {
        const chk = document.getElementById(`p-check-${idx}`);
        if (chk && chk.checked) {
          checkedNames.push(name);
        }
      });

      if (checkedNames.length === 0) {
        alert('振り分けるプレイヤーにチェックを入れてください。');
        return;
      }

      // シャッフル
      for (let i = checkedNames.length - 1; i > 0; i--) {
        const j = Math.floor(Math.random() * (i + 1));
        [checkedNames[i], checkedNames[j]] = [checkedNames[j], checkedNames[i]];
      }

      state.p1Team = [];
      state.p2Team = [];
      state.p1Bench = [];
      state.p2Bench = [];

      checkedNames.forEach((name, index) => {
        const playerObj = { name: name, char: '' };
        if (index % 2 === 0) {
          if (state.p1Team.length < state.maxSlots) {
            state.p1Team.push(playerObj);
          } else {
            state.p1Bench.push(playerObj);
          }
        } else {
          if (state.p2Team.length < state.maxSlots) {
            state.p2Team.push(playerObj);
          } else {
            state.p2Bench.push(playerObj);
          }
        }
      });

      renderAll();
    }

    function adjustSlotsToMax() {
      while (state.p1Team.length > state.maxSlots) {
        state.p1Bench.push(state.p1Team.pop());
      }
      while (state.p2Team.length > state.maxSlots) {
        state.p2Bench.push(state.p2Team.pop());
      }
    }

    function renderMasterPlayers() {
      const container = document.getElementById('player-tags-container');
      const currentCheckedState = {};
      state.playersMaster.forEach((_, idx) => {
        const chk = document.getElementById(`p-check-${idx}`);
        if (chk) {
          currentCheckedState[idx] = chk.checked;
        }
      });

      container.innerHTML = '';
      state.playersMaster.forEach((name, idx) => {
        const isChecked = currentCheckedState[idx] !== undefined ? currentCheckedState[idx] : true;
        const tag = document.createElement('div');
        tag.className = 'player-tag';
        tag.innerHTML = `
          <input type="checkbox" id="p-check-${idx}" ${isChecked ? 'checked' : ''}>
          <label for="p-check-${idx}">${escapeHtml(name)}</label>
          <span class="tag-remove" onclick="removeMasterPlayer(${idx})">×</span>
        `;
        container.appendChild(tag);
      });
    }

    function removeMasterPlayer(idx) {
      state.playersMaster.splice(idx, 1);
      renderMasterPlayers();
    }

    function renderAll() {
      renderMasterPlayers();
      renderSlots('p1-team-list', state.p1Team, state.maxSlots, '1P');
      renderSlots('p2-team-list', state.p2Team, state.maxSlots, '2P');
      renderBench('p1-bench-list', state.p1Bench);
      renderBench('p2-bench-list', state.p2Bench);
    }

    function renderSlots(containerId, teamArray, maxSlots, teamLabel) {
      const container = document.getElementById(containerId);
      container.innerHTML = '';

      for (let i = 0; i < maxSlots; i++) {
        const player = teamArray[i];
        const card = document.createElement('div');
        card.className = 'card';
        
        if (player) {
          card.innerHTML = `
            <div class="slot-idx">${i + 1}</div>
            <div class="card-info">
              <span class="p-name">${escapeHtml(player.name || '未設定')}</span>
              <span class="c-name">${escapeHtml(player.char || 'キャラ未選択')}</span>
            </div>
            <div class="card-btns">
              <button class="btn btn-xs">勝</button>
              <button class="btn btn-xs">負</button>
            </div>
          `;
        } else {
          card.style.opacity = '0.4';
          card.innerHTML = `
            <div class="slot-idx">${i + 1}</div>
            <div class="card-info">
              <span class="p-name" style="color:#777;">(空き枠)</span>
            </div>
          `;
        }
        container.appendChild(card);
      }
    }

    function renderBench(containerId, benchArray) {
      const container = document.getElementById(containerId);
      container.innerHTML = '';
      benchArray.forEach((player) => {
        const card = document.createElement('div');
        card.className = 'card bench-card';
        card.innerHTML = `
          <div class="card-info">
            <span class="p-name">${escapeHtml(player.name)}</span>
          </div>
        `;
        container.appendChild(card);
      });
    }

    function escapeHtml(str) {
      return String(str).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;');
    }

    window.onload = init;
  </script>
</body>
</html>
