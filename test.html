<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <title>対戦組み合わせ抽選ツール</title>
    <style>
        body {
            font-family: sans-serif;
            background-color: #1a1a1a;
            color: #ffffff;
            margin: 0;
            padding: 20px;
        }
        .container {
            max-width: 800px;
            margin: 0 auto;
            background: #2a2a2a;
            padding: 20px;
            border-radius: 8px;
        }
        h1, h2 {
            text-align: center;
        }
        .section {
            margin-bottom: 20px;
            padding: 15px;
            background: #333;
            border-radius: 6px;
        }
        label {
            display: block;
            margin-bottom: 5px;
        }
        input[type="text"], select {
            width: 100%;
            padding: 8px;
            margin-bottom: 10px;
            box-sizing: border-box;
            background: #444;
            color: #fff;
            border: 1px solid #555;
            border-radius: 4px;
        }
        button {
            background: #4CAF50;
            color: white;
            padding: 10px 15px;
            border: none;
            border-radius: 4px;
            cursor: pointer;
            font-size: 16px;
        }
        button:hover {
            background: #45a049;
        }
        .checkbox-group {
            display: flex;
            flex-wrap: wrap;
            gap: 10px;
            max-height: 150px;
            overflow-y: auto;
            background: #222;
            padding: 10px;
            border-radius: 4px;
        }
        .checkbox-item {
            display: flex;
            align-items: center;
            gap: 5px;
        }
        table {
            width: 100%;
            border-collapse: collapse;
            margin-top: 10px;
        }
        th, td {
            border: 1px solid #555;
            padding: 8px;
            text-align: center;
        }
        th {
            background: #444;
        }
        .hidden {
            display: none;
        }
    </style>
</head>
<body>

<div class="container">
    <h1>対戦組み合わせ抽選ツール</h1>

    <!-- プレーヤー管理画面 -->
    <div id="setup-section" class="section">
        <h2>プレーヤー登録</h2>
        <label for="player-name">名前:</label>
        <input type="text" id="player-name" placeholder="名前を入力してエンター">
        <button id="add-player-btn">追加</button>
        
        <h3>登録済みプレーヤー一覧 (チェックで今回参加)</h3>
        <div id="player-checkbox-container" class="checkbox-group"></div>
        <button id="to-lottery-btn" style="margin-top: 10px;">抽選画面へ進む</button>
    </div>

    <!-- 抽選・設定画面 -->
    <div id="lottery-section" class="section hidden">
        <h2>抽選設定</h2>
        <label>
            <input type="checkbox" id="handicap-mode"> ハンデ戦モード（強キャラ・弱キャラ等の調整用）
        </label>
        <label>
            <input type="checkbox" id="blind-mode" checked> 完全ランダム化（操作者にも結果を隠して裏で決定）
        </label>
        
        <button id="start-lottery-btn" style="margin-top: 15px; width: 100%;">抽選開始（裏で決定）</button>
        <button id="back-to-setup-btn" style="margin-top: 10px; background: #666;">プレーヤー設定に戻る</button>
    </div>

    <!-- 結果発表画面 -->
    <div id="result-section" class="section hidden">
        <h2>対戦組み合わせ結果</h2>
        <div id="result-container"></div>
        <button id="restart-btn" style="margin-top: 15px;">もう一度抽選する</button>
    </div>
</div>

<script>
    // キャラクターリスト（必要に応じて変更可能）
    const characters = ["リュウ", "ケン", "春麗", "ガイル", "ザンギエフ", "本田", "ブランカ", "エドモンド本田"];

    // ローカルストレージからのデータ読み込み・初期化
    let players = JSON.parse(localStorage.getItem('ssf2x_players')) || [];
    let checkedStates = JSON.parse(localStorage.getItem('ssf2x_checked')) || {};

    const playerNameInput = document.getElementById('player-name');
    const addPlayerBtn = document.getElementById('add-player-btn');
    const playerCheckboxContainer = document.getElementById('player-checkbox-container');
    const toLotteryBtn = document.getElementById('to-lottery-btn');

    const setupSection = document.getElementById('setup-section');
    const lotterySection = document.getElementById('lottery-section');
    const resultSection = document.getElementById('result-section');

    const handicapMode = document.getElementById('handicap-mode');
    const blindMode = document.getElementById('blind-mode');
    const startLotteryBtn = document.getElementById('start-lottery-btn');
    const backToSetupBtn = document.getElementById('back-to-setup-btn');
    const resultContainer = document.getElementById('result-container');
    const restartBtn = document.getElementById('restart-btn');

    // プレーヤーリストの描画とチェックボックス状態の保存
    function renderPlayerCheckboxes() {
        playerCheckboxContainer.innerHTML = '';
        if (players.length === 0) {
            playerCheckboxContainer.innerHTML = '<span style="color: #888;">プレーヤーが登録されていません</span>';
            return;
        }
        players.forEach(player => {
            const div = document.createElement('div');
            div.className = 'checkbox-item';

            const checkbox = document.createElement('input');
            checkbox.type = 'checkbox';
            checkbox.value = player;
            checkbox.id = 'chk_' + player;
            // 保存されている状態があれば反映、なければデフォルトでチェック
            checkbox.checked = checkedStates[player] !== undefined ? checkedStates[player] : true;

            checkbox.addEventListener('change', () => {
                checkedStates[player] = checkbox.checked;
                localStorage.setItem('ssf2x_checked', JSON.stringify(checkedStates));
            });

            const label = document.createElement('label');
            label.htmlFor = 'chk_' + player;
            label.textContent = player;
            label.style.marginBottom = '0';
            label.style.cursor = 'pointer';

            // 削除ボタン
            const delBtn = document.createElement('button');
            delBtn.textContent = '×';
            delBtn.style.padding = '2px 6px';
            delBtn.style.fontSize = '12px';
            delBtn.style.background = '#d9534f';
            delBtn.style.marginLeft = '5px';
            delBtn.onclick = () => {
                players = players.filter(p => p !== player);
                delete checkedStates[player];
                localStorage.setItem('ssf2x_players', JSON.stringify(players));
                localStorage.setItem('ssf2x_checked', JSON.stringify(checkedStates));
                renderPlayerCheckboxes();
            };

            div.appendChild(checkbox);
            div.appendChild(label);
            div.appendChild(delBtn);
            playerCheckboxContainer.appendChild(div);
        });
    }

    // プレーヤー追加処理
    function addPlayer() {
        const name = playerNameInput.value.trim();
        if (name && !players.includes(name)) {
            players.push(name);
            checkedStates[name] = true;
            localStorage.setItem('ssf2x_players', JSON.stringify(players));
            localStorage.setItem('ssf2x_checked', JSON.stringify(checkedStates));
            playerNameInput.value = '';
            renderPlayerCheckboxes();
        }
    }

    addPlayerBtn.addEventListener('click', addPlayer);
    playerNameInput.addEventListener('keypress', (e) => {
        if (e.key === 'Enter') {
            addPlayer();
        }
    });

    // 画面遷移：設定 → 抽選
    toLotteryBtn.addEventListener('click', () => {
        const activePlayers = players.filter(p => checkedStates[p]);
        if (activePlayers.length < 2) {
            alert('参加するプレーヤーを2人以上チェックしてください。');
            return;
        }
        setupSection.classList.add('hidden');
        lotterySection.classList.remove('hidden');
    });

    // 画面遷移：抽選 → 設定
    backToSetupBtn.addEventListener('click', () => {
        lotterySection.classList.add('hidden');
        setupSection.classList.remove('hidden');
    });

    // 配列シャッフル用
    function shuffle(array) {
        let currentIndex = array.length, randomIndex;
        while (currentIndex !== 0) {
            randomIndex = Math.floor(Math.random() * currentIndex);
            currentIndex--;
            [array[currentIndex], array[randomIndex]] = [array[randomIndex], array[currentIndex]];
        }
        return array;
    }

    // 抽選開始ボタン（1点目の修正：完全ランダム時は一切中身を見せず裏で決めて結果画面へ移行）
    startLotteryBtn.addEventListener('click', () => {
        const activePlayers = [...players.filter(p => checkedStates[p])];
        shuffle(activePlayers);

        let html = '';

        if (handicapMode.checked) {
            // ハンデ戦モード
            html += '<table><tr><th>プレーヤー</th><th>割り当てキャラ</th></tr>';
            activePlayers.forEach(player => {
                const randomChar = characters[Math.floor(Math.random() * characters.length)];
                html += `<tr><td>${player}</td><td>${randomChar}</td></tr>`;
            });
            html += '</table>';
        } else {
            // 通常対戦組み合わせ
            html += '<table><tr><th>第◯試合</th><th>プレーヤー 1</th><th>VS</th><th>プレーヤー 2</th></tr>';
            for (let i = 0; i < activePlayers.length; i += 2) {
                const p1 = activePlayers[i];
                const p2 = activePlayers[i + 1] !== undefined ? activePlayers[i + 1] : '（不戦勝 / シード）';
                html += `<tr><td>Match ${Math.floor(i / 2) + 1}</td><td>${p1}</td><td>-</td><td>${p2}</td></tr>`;
            }
            html += '</table>';
        }

        resultContainer.innerHTML = html;
        lotterySection.classList.add('hidden');
        resultSection.classList.remove('hidden');
    });

    // もう一度抽選
    restartBtn.addEventListener('click', () => {
        resultSection.classList.add('hidden');
        lotterySection.classList.remove('hidden');
    });

    // 初期描画実行
    renderPlayerCheckboxes();
</script>

</body>
</html>
