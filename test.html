<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>スパ2X リアルタイム対戦管理ツール</title>
  <style>
    :root {
      --bg-color: #121212;
      --card-bg: #1e1e1e;
      --text-color: #ffffff;
      --accent-color: #ff9800;
      --p1-color: #2196f3;
      --p2-color: #f44336;
      --border-color: #333333;
    }

    body {
      font-family: 'Helvetica Neue', Arial, sans-serif;
      background-color: var(--bg-color);
      color: var(--text-color);
      margin: 0;
      padding: 10px;
      box-sizing: border-box;
    }

    header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 10px;
      background-color: #000;
      border-radius: 8px;
      margin-bottom: 15px;
      flex-wrap: wrap;
      gap: 10px;
    }

    .room-info {
      font-weight: bold;
      color: var(--accent-color);
    }

    .header-controls {
      display: flex;
      gap: 10px;
      align-items: center;
    }

    input[type="text"], select, input[type="number"] {
      background-color: #222;
      color: #fff;
      border: 1px solid var(--border-color);
      padding: 6px 10px;
      border-radius: 4px;
    }

    button {
      background-color: var(--accent-color);
      color: #000;
      border: none;
      padding: 6px 14px;
      font-weight: bold;
      border-radius: 4px;
      cursor: pointer;
      transition: opacity 0.2s;
    }

    button:hover { opacity: 0.8; }
    button.secondary { background-color: #555; color: #fff; }

    .main-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
      gap: 10px;
      margin-bottom: 20px;
    }

    .card {
      background-color: var(--card-bg);
      border: 1px solid var(--border-color);
      border-radius: 6px;
      padding: 8px;
      display: flex;
      flex-direction: column;
      gap: 6px;
    }

    .card-header {
      font-size: 0.85em;
      color: #888;
      display: flex;
      justify-content: space-between;
    }

    .match-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 6px;
    }

    .side {
      flex: 1;
      display: flex;
      align-items: center;
      gap: 6px;
      padding: 4px;
      border-radius: 4px;
    }

    .side.p1 { background-color: rgba(33, 150, 243, 0.1); }
    .side.p2 { background-color: rgba(244, 67, 54, 0.1); }
    .side.right { flex-direction: row-reverse; text-align: right; }

    .char-img {
      width: 48px;
      height: 48px;
      object-fit: contain;
      background-color: #000;
      border-radius: 4px;
      border: 1px solid #444;
    }

    .player-details {
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }

    .p-name {
      font-weight: bold;
      font-size: 0.9em;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .c-name { font-size: 0.75em; color: #aaa; }
    .vs-badge { font-weight: bold; font-style: italic; color: var(--accent-color); font-size: 0.9em; }

    /* モーダルUI */
    .modal {
      display: none;
      position: fixed;
      top: 0; left: 0; width: 100%; height: 100%;
      background: rgba(0,0,0,0.8);
      z-index: 100;
      justify-content: center;
      align-items: center;
    }

    .modal.open { display: flex; }

    .modal-content {
      background-color: var(--card-bg);
      border: 1px solid var(--border-color);
      padding: 20px;
      border-radius: 8px;
      max-width: 900px;
      width: 95%;
      max-height: 90vh;
      overflow-y: auto;
    }

    .modal-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 15px;
      border-bottom: 1px solid var(--border-color);
      padding-bottom: 10px;
    }

    .config-bar {
      display: flex;
      gap: 15px;
      align-items: center;
      background: #151515;
      padding: 12px;
      border-radius: 6px;
      margin-bottom: 15px;
      flex-wrap: wrap;
    }

    .team-settings {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 15px;
    }

    @media (max-width: 600px) {
      .team-settings { grid-template-columns: 1fr; }
    }

    .team-box {
      border: 1px solid var(--border-color);
      padding: 10px;
      border-radius: 6px;
    }

    .team-box.p1-box { border-top: 4px solid var(--p1-color); }
    .team-box.p2-box { border-top: 4px solid var(--p2-color); }

    .slot-row {
      display: flex;
      gap: 5px;
      margin-bottom: 6px;
      align-items: center;
    }

    .slot-num { width: 22px; font-size: 0.8em; color: #888; }

    .bench-area {
      margin-top: 15px;
      padding: 10px;
      background: #111;
      border-radius: 6px;
    }

    .bench-title { font-size: 0.85em; color: var(--accent-color); margin-bottom: 5px; }
    .bench-list { display: flex; flex-wrap: wrap; gap: 8px; }

    .bench-chip {
      background: #222;
      border: 1px solid #444;
      padding: 3px 8px;
      border-radius: 4px;
      font-size: 0.8em;
    }
  </style>
</head>
<body>

  <header>
    <div class="room-info">
      部屋名: <span id="display-room-name">未接続</span>
    </div>
    <div class="header-controls">
      <input type="text" id="room-input" placeholder="部屋名を入力">
      <button onclick="changeRoom()">部屋移動</button>
      <button onclick="openModal()" class="secondary">⚙ オーダー・ルール設定</button>
    </div>
  </header>

  <!-- メイン表示（対戦枠） -->
  <div class="main-grid" id="match-cards-container"></div>

  <!-- ベンチ（控えメンバー表示） -->
  <div class="bench-area" id="bench-container" style="display: none;">
    <div class="bench-title">ベンチ（控えメンバー）</div>
    <div class="bench-list" id="bench-list"></div>
  </div>

  <!-- 設定モーダル -->
  <div class="modal" id="settings-modal">
    <div class="modal-content">
      <div class="modal-header">
        <h3>対戦オーダー・ルール設定</h3>
        <button onclick="closeModal()">✕ 閉じる</button>
      </div>

      <!-- ルール設定バー -->
      <div class="config-bar">
        <div>
          <label>1人あたりの持ちキャラ数: </label>
          <select id="chars-per-player-select" onchange="applyRuleSettings()">
            <option value="1">1キャラ（通常）</option>
            <option value="2">2キャラ（4人8枠 / 6人12枠など）</option>
            <option value="3">3キャラ</option>
            <option value="4">4キャラ</option>
          </select>
        </div>

        <div>
          <label>合計対戦枠数: </label>
          <select id="total-slots-select" onchange="applyRuleSettings()">
            <option value="6">6枠 (3vs3)</option>
            <option value="8">8枠 (4vs4)</option>
            <option value="10">10枠 (5vs5)</option>
            <option value="12">12枠 (6vs6)</option>
            <option value="14">14枠 (7vs7)</option>
            <option value="16" selected>16枠 (8vs8)</option>
          </select>
        </div>

        <div>
          <label>
            <input type="checkbox" id="counter-mode-toggle" onchange="toggleCounterMode()"> 被せモード
          </label>
        </div>
      </div>

      <!-- チーム設定 -->
      <div class="team-settings">
        <!-- 1P チーム -->
        <div class="team-box p1-box">
          <h4>1P チーム エントリー</h4>
          <div style="margin-bottom: 10px; display: flex; flex-direction: column; gap: 5px;">
            <input type="text" id="p1-players-input" placeholder="参加者名をカンマ区切り (例: A, B, C)">
            <button onclick="autoGenerateSlots('p1')" class="secondary">👥 プレイヤー名から枠を自動作成</button>
          </div>
          <hr style="border-color: #333; margin: 10px 0;">
          <div id="p1-slots-inputs"></div>
          <button onclick="randomizeTeam('p1')" class="secondary" style="width: 100%; margin-top: 8px;">🎲 1P キャラランダム設定</button>
        </div>

        <!-- 2P チーム -->
        <div class="team-box p2-box">
          <h4>2P チーム エントリー</h4>
          <div style="margin-bottom: 10px; display: flex; flex-direction: column; gap: 5px;">
            <input type="text" id="p2-players-input" placeholder="参加者名をカンマ区切り (例: D, E, F)">
            <button onclick="autoGenerateSlots('p2')" class="secondary">👥 プレイヤー名から枠を自動作成</button>
          </div>
          <hr style="border-color: #333; margin: 10px 0;">
          <div id="p2-slots-inputs"></div>
          <button onclick="randomizeTeam('p2')" class="secondary" style="width: 100%; margin-top: 8px;">🎲 2P キャラランダム設定</button>
        </div>
      </div>

      <div style="margin-top: 20px; display: flex; justify-content: space-between;">
        <button onclick="clearAllData()" class="secondary" style="background-color: #c62828; color: #fff;">全データリセット</button>
        <button onclick="saveAndCloseModal()">保存して適用</button>
      </div>
    </div>
  </div>

  <!-- Firebase SDKs -->
  <script src="https://www.gstatic.com/firebasejs/9.22.1/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.22.1/firebase-database-compat.js"></script>

  <script>
    const CHARACTERS = [
      { id: "ryu", name: "リュウ" },
      { id: "ken", name: "ケン" },
      { id: "e_honda", name: "エドモンド本田" },
      { id: "chun_li", name: "春麗" },
      { id: "blanka", name: "ブランカ" },
      { id: "zangief", name: "ザンギエフ" },
      { id: "guile", name: "ガイル" },
      { id: "dhalsim", name: "ダルシム" },
      { id: "feilong", name: "飛龍（フェイロン）" },
      { id: "cammy", name: "キャミィ" },
      { id: "t_hawk", name: "サンダー・ホーク" },
      { id: "dee_jay", name: "ディージェイ" },
      { id: "boxer", name: "バイソン" },
      { id: "m_bison", name: "バルログ" },
      { id: "sagat", name: "サガット" },
      { id: "vega", name: "ベガ" }
    ];

    const firebaseConfig = {
      databaseURL: "https://sf2x-app-default-rtdb.firebaseio.com/"
    };
    firebase.initializeApp(firebaseConfig);
    const db = firebase.database();

    let currentRoom = "default";
    let totalSlots = 16;
    let charsPerPlayer = 1;
    let isCounterMode = false;
    let roomData = {
      totalSlots: 16,
      charsPerPlayer: 1,
      isCounterMode: false,
      p1: [],
      p2: []
    };

    window.addEventListener('DOMContentLoaded', () => {
      const urlParams = new URLSearchParams(window.location.search);
      const roomParam = urlParams.get('room');
      currentRoom = roomParam ? roomParam : 'room1';
      document.getElementById('display-room-name').innerText = currentRoom;
      document.getElementById('room-input').value = currentRoom;

      initDataStructure();
      listenToRoomData();
    });

    function initDataStructure() {
      roomData.p1 = Array.from({ length: 8 }, (_, i) => ({ player: `1P_P${i+1}`, char: CHARACTERS[i % 16].id }));
      roomData.p2 = Array.from({ length: 8 }, (_, i) => ({ player: `2P_P${i+1}`, char: CHARACTERS[(i+8) % 16].id }));
    }

    function listenToRoomData() {
      const roomRef = db.ref('sf2x_rooms/' + currentRoom);
      roomRef.on('value', (snapshot) => {
        const val = snapshot.val();
        if (val) {
          roomData = val;
          if (!roomData.p1) roomData.p1 = [];
          if (!roomData.p2) roomData.p2 = [];
          totalSlots = roomData.totalSlots || 16;
          charsPerPlayer = roomData.charsPerPlayer || 1;
          isCounterMode = !!roomData.isCounterMode;
        } else {
          roomData.totalSlots = totalSlots;
          roomData.charsPerPlayer = charsPerPlayer;
          roomData.isCounterMode = isCounterMode;
          saveToFirebase();
        }
        renderUI();
      });
    }

    function saveToFirebase() {
      roomData.totalSlots = totalSlots;
      roomData.charsPerPlayer = charsPerPlayer;
      roomData.isCounterMode = isCounterMode;
      db.ref('sf2x_rooms/' + currentRoom).set(roomData);
    }

    function changeRoom() {
      const newRoom = document.getElementById('room-input').value.trim();
      if (newRoom) {
        window.location.search = `?room=${encodeURIComponent(newRoom)}`;
      }
    }

    function renderUI() {
      const container = document.getElementById('match-cards-container');
      container.innerHTML = '';
      const matchPairs = totalSlots / 2;

      for (let i = 0; i < matchPairs; i++) {
        const p1Data = roomData.p1[i] || { player: '', char: 'ryu' };
        const p2Data = roomData.p2[i] || { player: '', char: 'ryu' };

        const card = document.createElement('div');
        card.className = 'card';
        card.innerHTML = `
          <div class="card-header">
            <span>第 ${i + 1} 試合</span>
          </div>
          <div class="match-row">
            <div class="side p1">
              <img src="image/${p1Data.char}_0.png" class="char-img" onerror="this.src='https://via.placeholder.com/48?text=?';">
              <div class="player-details">
                <span class="p-name">${escapeHtml(p1Data.player)}</span>
                <span class="c-name">${getCharName(p1Data.char)}</span>
              </div>
            </div>
            <div class="vs-badge">VS</div>
            <div class="side p2 right">
              <img src="image/${p2Data.char}_0.png" class="char-img" onerror="this.src='https://via.placeholder.com/48?text=?';">
              <div class="player-details">
                <span class="p-name">${escapeHtml(p2Data.player)}</span>
                <span class="c-name">${getCharName(p2Data.char)}</span>
              </div>
            </div>
          </div>
        `;
        container.appendChild(card);
      }
    }

    // --- モーダル制御 ---
    function openModal() {
      document.getElementById('total-slots-select').value = totalSlots;
      document.getElementById('chars-per-player-select').value = charsPerPlayer;
      document.getElementById('counter-mode-toggle').checked = isCounterMode;
      renderModalInputs();
      document.getElementById('settings-modal').classList.add('open');
    }

    function closeModal() {
      document.getElementById('settings-modal').classList.remove('open');
    }

    function applyRuleSettings() {
      totalSlots = parseInt(document.getElementById('total-slots-select').value, 10);
      charsPerPlayer = parseInt(document.getElementById('chars-per-player-select').value, 10);
      renderModalInputs();
    }

    function renderModalInputs() {
      const teamSlots = totalSlots / 2;
      const p1Box = document.getElementById('p1-slots-inputs');
      const p2Box = document.getElementById('p2-slots-inputs');

      p1Box.innerHTML = '';
      p2Box.innerHTML = '';

      for (let i = 0; i < teamSlots; i++) {
        p1Box.appendChild(createSlotInputRow('p1', i));
        p2Box.appendChild(createSlotInputRow('p2', i));
      }
    }

    function createSlotInputRow(team, index) {
      const data = (roomData[team] && roomData[team][index]) ? roomData[team][index] : { player: `P${index+1}`, char: 'ryu' };
      const row = document.createElement('div');
      row.className = 'slot-row';

      let charOptions = CHARACTERS.map(c => 
        `<option value="${c.id}" ${data.char === c.id ? 'selected' : ''}>${c.name}</option>`
      ).join('');

      row.innerHTML = `
        <span class="slot-num">${index + 1}</span>
        <input type="text" id="${team}-p-name-${index}" value="${escapeHtml(data.player)}" placeholder="名前" style="flex: 1;">
        <select id="${team}-c-select-${index}">
          ${charOptions}
        </select>
      `;
      return row;
    }

    // 👥 プレイヤー名から枠を自動作成（1人○キャラを考慮）
    function autoGenerateSlots(team) {
      const inputVal = document.getElementById(`${team}-players-input`).value;
      if (!inputVal.trim()) return;

      const players = inputVal.split(/[,、\n]/).map(s => s.trim()).filter(s => s.length > 0);
      if (players.length === 0) return;

      const teamSlots = totalSlots / 2;
      let playerIndex = 0;
      let countForCurrentPlayer = 0;

      for (let i = 0; i < teamSlots; i++) {
        const nameInput = document.getElementById(`${team}-p-name-${i}`);
        if (nameInput) {
          const currentPlayerName = players[playerIndex % players.length];
          nameInput.value = currentPlayerName;

          countForCurrentPlayer++;
          if (countForCurrentPlayer >= charsPerPlayer) {
            playerIndex++;
            countForCurrentPlayer = 0;
          }
        }
      }
    }

    function randomizeTeam(team) {
      const teamSlots = totalSlots / 2;
      let shuffledChars = [...CHARACTERS].sort(() => Math.random() - 0.5);

      for (let i = 0; i < teamSlots; i++) {
        const selectEl = document.getElementById(`${team}-c-select-${i}`);
        if (selectEl) {
          selectEl.value = shuffledChars[i % shuffledChars.length].id;
        }
      }
    }

    function saveAndCloseModal() {
      totalSlots = parseInt(document.getElementById('total-slots-select').value, 10);
      charsPerPlayer = parseInt(document.getElementById('chars-per-player-select').value, 10);
      isCounterMode = document.getElementById('counter-mode-toggle').checked;

      const teamSlots = totalSlots / 2;
      let newP1 = [];
      let newP2 = [];

      for (let i = 0; i < teamSlots; i++) {
        const p1Name = document.getElementById(`p1-p-name-${i}`)?.value || `1P_${i+1}`;
        const p1Char = document.getElementById(`p1-c-select-${i}`)?.value || 'ryu';
        newP1.push({ player: p1Name, char: p1Char });

        const p2Name = document.getElementById(`p2-p-name-${i}`)?.value || `2P_${i+1}`;
        const p2Char = document.getElementById(`p2-c-select-${i}`)?.value || 'ryu';
        newP2.push({ player: p2Name, char: p2Char });
      }

      roomData.p1 = newP1;
      roomData.p2 = newP2;

      saveToFirebase();
      closeModal();
    }

    function clearAllData() {
      if (confirm("本当にこの部屋のオーダーを初期化しますか？")) {
        initDataStructure();
        saveToFirebase();
        closeModal();
      }
    }

    function toggleCounterMode() {
      isCounterMode = document.getElementById('counter-mode-toggle').checked;
    }

    function getCharName(id) {
      const charObj = CHARACTERS.find(c => c.id === id);
      return charObj ? charObj.name : id;
    }

    function escapeHtml(str) {
      if (!str) return '';
      return str.replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;');
    }
  </script>
</body>
</html>
